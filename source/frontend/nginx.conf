# Nginx phục vụ bản build tĩnh của frontend + proxy /api sang backend.
# Frontend và API cùng một origin (qua nginx) nên KHÔNG phát sinh CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén văn bản
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Asset Vite có tên băm (hash) → cache dài, bất biến
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend (giữ nguyên đường dẫn /api/...; backend base là /api/v1)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: mọi route khác (kể cả /m/pos, /kho, /kiem-ke…) trả về index.html
    # để React Router tự xử lý — không thì F5 ở route sâu sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
