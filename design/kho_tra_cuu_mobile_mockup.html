<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu tồn kho · BrewDesk Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1510;--cocoa:#442D1C;--cocoa-lt:#5C3D22;
  --rogue:#3A3D2E;--rogue-dk:#272A1F;
  --caramel:#84592B;--olive:#9D9167;--olive-mute:#C4BAA0;
  --batter:#EDE3CE;--batter-lt:#F5EDD8;--batter-warm:#E2D4B7;
  --wine:#743014;--green:#3C6E2E;--cream:#FAF6EE;
  --serif:'DM Serif Display',Georgia,serif;
  --ui:'Plus Jakarta Sans',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:#3a3a3a;display:flex;justify-content:center;padding:24px 0;min-height:100vh}

.phone{width:390px;height:800px;background:var(--batter);border-radius:36px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;position:relative}

.status-bar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;color:var(--ink)}

.topbar{padding:6px 18px 14px;flex-shrink:0}
.topbar-row{display:flex;align-items:center;gap:10px}
.back-btn{width:32px;height:32px;border-radius:10px;background:rgba(58,61,46,.08);color:var(--rogue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-title{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink)}
.topbar-sub{font-size:11px;color:var(--olive);margin-top:2px}

.search-wrap{position:relative;margin-top:12px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--olive)}
.search-wrap input{width:100%;height:44px;border-radius:14px;border:1px solid var(--olive-mute);background:var(--cream);padding:0 14px 0 40px;font-family:var(--ui);font-size:14px}
.search-wrap input:focus{outline:none;border-color:var(--rogue)}

.chip-scroll{display:flex;gap:7px;overflow-x:auto;padding:12px 18px 4px;flex-shrink:0;scrollbar-width:none}
.chip-scroll::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--olive-mute);background:var(--cream);color:var(--olive);font-size:12.5px;font-weight:600;white-space:nowrap}
.cat-chip.active{background:var(--rogue);border-color:var(--rogue);color:var(--batter-lt)}

.list-scroll{flex:1;overflow-y:auto;padding:6px 18px 90px}
.cat-section-title{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--caramel);padding:18px 2px 8px}
.cat-section-title:first-child{padding-top:4px}
.ing-card{display:flex;align-items:center;gap:12px;background:var(--cream);border:1px solid rgba(196,186,160,.5);border-radius:14px;padding:13px 14px;margin-bottom:8px;min-height:64px}
.ing-icon{width:38px;height:38px;border-radius:10px;background:var(--batter-warm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing-icon svg{width:19px;height:19px;color:var(--cocoa)}
.ing-info{flex:1;min-width:0}
.ing-name{font-size:13.5px;font-weight:600;color:var(--ink)}
.ing-threshold{font-size:10.5px;color:var(--olive);margin-top:2px}
.ing-stock-block{text-align:right;flex-shrink:0}
.ing-stock-num{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink)}
.ing-stock-unit{font-size:10.5px;color:var(--olive);font-weight:600}
.stock-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:4px}
.stock-dot.ok{background:var(--green)}
.stock-dot.low{background:var(--wine)}
.badge-low{display:block;font-size:9.5px;font-weight:700;color:var(--wine);margin-top:3px}

.empty-state{text-align:center;padding:60px 20px;color:var(--olive);font-size:13px}

.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:linear-gradient(120deg,#1C1510 0%,#2E1E12 60%,#5C3D22 100%);display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;border-radius:0 0 36px 36px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(196,186,160,.55);font-size:9.5px;font-weight:600}
.nav-btn svg{width:19px;height:19px}
.nav-btn.active{color:var(--batter-lt)}
.nav-btn.active svg{color:var(--caramel)}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>21:05</span>
    <span>🔋 100%</span>
  </div>

  <div class="topbar">
    <div class="topbar-row">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div>
        <div class="topbar-title">Tra cứu tồn kho</div>
        <div class="topbar-sub" id="lastUpdate">Cập nhật lúc 21:05 · chỉ xem</div>
      </div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchBox" placeholder="Tìm nguyên liệu..."/>
    </div>
  </div>

  <div class="chip-scroll" id="chipScroll"></div>

  <div class="list-scroll" id="listScroll"></div>

  <div class="bottom-nav">
    <div class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      POS
    </div>
    <div class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Checklist
    </div>
    <div class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/></svg>
      Test cafe
    </div>
    <div class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Kho
    </div>
  </div>
</div>

<script>
const CATS=['Tất cả','Coffee','Powder','Tea','Sweet','Milk & Rượu','Syrup','Homemade','Topping','Cleaning'];
const ICONS={
  'Coffee':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
  'Powder':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0-2 19.8"/><path d="M12 2a10 10 0 0 1 2 19.8"/><path d="M12 6v12"/></svg>',
  'Tea':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M5 17h11v-2a3 3 0 0 0-3-3H8a3 3 0 0 0-3 3z"/><path d="M16 12h2a2 2 0 0 1 0 4h-1"/><path d="M9 5c0 1.5 2 1.5 2 3M13 5c0 1.5 2 1.5 2 3"/></svg>',
  'Sweet':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 3-8 6-8 11a8 8 0 0 0 16 0c0-5-4-8-8-11z"/><path d="M9 14c1 1 2 1 3 0s2-1 3 0"/></svg>',
  'Milk & Rượu':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8"/><path d="M9 2v6l-3 4v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8l-3-4V2"/><line x1="6" y1="14" x2="18" y2="14"/></svg>',
  'Syrup':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6"/><path d="M10 2v5.5L6 12v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8l-4-4.5V2"/><line x1="7" y1="16" x2="17" y2="16"/></svg>',
  'Homemade':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  'Topping':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="1.2"/><circle cx="14" cy="6" r="1.2"/><circle cx="12" cy="9.5" r="1.2"/><path d="M5 10h14l-1.5 10a2 2 0 0 1-2 1.8H8.5A2 2 0 0 1 6.5 20z"/></svg>',
  'Cleaning':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21l7-7"/><path d="M13.5 6.5 20 13a2.121 2.121 0 0 1-3 3l-6.5-6.5"/><path d="M10.5 3.5 13 6l-2.5 2.5L8 6z"/></svg>'
};
const DEFAULT_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/></svg>';

const INGREDIENTS=[
  {name:'Arabica',cat:'Coffee',unit:'kg',stock:6,threshold:5},
  {name:'Robusta',cat:'Coffee',unit:'kg',stock:3,threshold:5},
  {name:'Coldbrew (ủ sẵn)',cat:'Coffee',unit:'kg',stock:3,threshold:2},
  {name:'Matcha',cat:'Powder',unit:'kg',stock:0.4,threshold:0.5},
  {name:'Cacao',cat:'Powder',unit:'kg',stock:0.4,threshold:0.3},
  {name:'Jasmine',cat:'Tea',unit:'kg',stock:0.7,threshold:0.3},
  {name:'Oolong',cat:'Tea',unit:'kg',stock:0.4,threshold:0.4},
  {name:'Đường vàng',cat:'Sweet',unit:'kg',stock:7,threshold:3},
  {name:'Mật ong',cat:'Sweet',unit:'chai',stock:3,threshold:2},
  {name:'Sữa tươi',cat:'Milk & Rượu',unit:'lít',stock:4,threshold:8},
  {name:'Bailey',cat:'Milk & Rượu',unit:'chai',stock:1.2,threshold:1},
  {name:'Syrup Vani',cat:'Syrup',unit:'chai',stock:2,threshold:3},
  {name:'Syrup Caramel',cat:'Syrup',unit:'chai',stock:1.5,threshold:1.5},
  {name:'Sấu ngâm',cat:'Homemade',unit:'bình',stock:1.5,threshold:1},
  {name:'Vải lon',cat:'Topping',unit:'lon',stock:29,threshold:10},
  {name:'Nước lau sàn',cat:'Cleaning',unit:'bịch',stock:3,threshold:2}
];

let curCat='Tất cả';

function renderChips(){
  const wrap=document.getElementById('chipScroll');
  wrap.innerHTML='';
  CATS.forEach(c=>{
    const chip=document.createElement('div');
    chip.className='cat-chip'+(curCat===c?' active':'');
    chip.textContent=c;
    chip.onclick=()=>{ curCat=c; renderChips(); renderList(); };
    wrap.appendChild(chip);
  });
}
renderChips();

function renderList(){
  const search=document.getElementById('searchBox').value.toLowerCase();
  const wrap=document.getElementById('listScroll');
  wrap.innerHTML='';
  const cats=curCat==='Tất cả'?CATS.slice(1):[curCat];
  let anyShown=false;
  cats.forEach(cat=>{
    const items=INGREDIENTS.filter(i=>i.cat===cat && (!search||i.name.toLowerCase().includes(search)));
    if(items.length===0) return;
    anyShown=true;
    const title=document.createElement('div');
    title.className='cat-section-title';
    title.textContent=cat;
    wrap.appendChild(title);
    items.forEach(it=>{
      const low=it.stock<it.threshold;
      const card=document.createElement('div');
      card.className='ing-card';
      card.innerHTML=
        '<div class="ing-icon">'+(ICONS[it.cat]||DEFAULT_ICON)+'</div>'+
        '<div class="ing-info">'+
          '<div class="ing-name">'+it.name+'</div>'+
          '<div class="ing-threshold">Ngưỡng cảnh báo: '+it.threshold+' '+it.unit+'</div>'+
        '</div>'+
        '<div class="ing-stock-block">'+
          '<span class="ing-stock-num">'+it.stock+'</span> <span class="ing-stock-unit">'+it.unit+'</span>'+
          (low?'<span class="badge-low">Sắp hết<span class="stock-dot low"></span></span>':'<span class="badge-low" style="color:var(--green)">Đủ hàng<span class="stock-dot ok"></span></span>')+
        '</div>';
      wrap.appendChild(card);
    });
  });
  if(!anyShown){
    wrap.innerHTML='<div class="empty-state">Không tìm thấy nguyên liệu phù hợp</div>';
  }
}
renderList();
document.getElementById('searchBox').addEventListener('input',renderList);
</script>
</body>
</html>
